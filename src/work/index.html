<!doctype html>
<html lang="en">
  <head>
    <!-- include:head.html -->
    <title>Michael Eggar | Work</title>
  </head>
  <body>
    <a class="skip-nav" href="#main-content">Skip to main content</a>
    <header class="site-header">
      <nav id="nav-placeholder" aria-label="primary">
        <!-- include:nav.html -->
      </nav>
    </header>

    <main id="main-content" class="main-container">
      <header class="work-index-header">
        <div>
          <p class="eyebrow">Selected projects</p>
          <h1>Work</h1>
        </div>
        <p class="work-index-copy">
          Websites and interfaces shaped through design, front-end development,
          and close collaboration.
        </p>
      </header>

      <section class="work-filters" aria-label="Work filters">
        <button
          class="work-filter is-active"
          type="button"
          data-work-filter="all"
          aria-pressed="true"
        >
          All
        </button>
        <button
          class="work-filter"
          type="button"
          data-work-filter="development"
          aria-pressed="false"
        >
          Development
        </button>
        <button
          class="work-filter"
          type="button"
          data-work-filter="design"
          aria-pressed="false"
        >
          Design
        </button>
      </section>

      <section class="work-grid" aria-live="polite" aria-label="Projects">
        <article
          class="work-card work-card-wide"
          data-categories="development design"
          data-featured="true"
        >
          <a href="chatapp/" aria-label="View Film Production Chat App project">
            <div class="work-card-media">
              <img
                src="/assets/images/chatapp/chat-onset-2b.jpg"
                alt=""
                loading="lazy"
              />
            </div>
            <div class="card-info">
              <h2>Film production chat app</h2>
            </div>
          </a>
        </article>

        <article class="work-card" data-categories="development design">
          <a
            href="retirementpath/"
            aria-label="View Retirement Investment Advisors website project"
          >
            <div class="work-card-media">
              <img
                src="/assets/images/ria/ria-website.jpg"
                alt=""
                loading="lazy"
              />
            </div>
            <div class="card-info">
              <h2>Retirement investment advisors</h2>
            </div>
          </a>
        </article>

        <article class="work-card" data-categories="development design">
          <a href="ductworx/" aria-label="View DuctWorx website project">
            <div class="work-card-media">
              <img
                src="/assets/images/ductworx/duc-mock-2.jpg"
                alt=""
                loading="lazy"
              />
            </div>
            <div class="card-info">
              <h2>DuctWorx website</h2>
            </div>
          </a>
        </article>

        <article
          class="work-card work-card-wide"
          data-categories="development"
          data-featured="true"
        >
          <a href="kochcomm/" aria-label="View Koch Comm website project">
            <div class="work-card-media">
              <img
                src="/assets/images/kochcomm/kc-website-1.jpg"
                alt=""
                loading="lazy"
              />
            </div>
            <div class="card-info">
              <h2>Koch Comm website</h2>
            </div>
          </a>
        </article>
      </section>
    </main>

    <footer class="site-footer">
      <!-- include:footer.html -->
    </footer>
    <script src="/assets/scripts/work.js"></script>
    <script src="/assets/scripts/utilities.js"></script>
  </body>
</html>
