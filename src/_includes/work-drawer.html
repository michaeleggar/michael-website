<dialog
  class="work-drawer"
  data-work-drawer
  aria-label="Project details"
  aria-modal="true"
  tabindex="-1"
>
  <div class="work-drawer-frame">
    <div
      class="work-drawer-scroll"
      data-work-drawer-scroll
      aria-busy="false"
    >
      <p class="work-drawer-loading" data-work-drawer-loading role="status" hidden>
        Loading project&hellip;
      </p>
      <div data-work-drawer-content></div>
    </div>
  </div>
</dialog>
