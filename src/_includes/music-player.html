<section id="music-player" class="music-player" aria-label="Music player" hidden>
  <span class="music-player-disc" aria-hidden="true">
    <img class="music-player-art" src="/assets/images/optimized/magdalena-bay-imaginal-disk.jpg" alt="" width="44" height="44" />
  </span>
  <div class="music-player-content">
    <div class="music-player-heading">
      <div class="music-player-meta">
        <a class="music-player-title" href="https://soundcloud.com/magbae/angel-on-a-satellite" target="_blank" rel="noopener noreferrer">Angel on a Satellite</a>
        <p class="music-player-artist">Magdalena Bay · <button type="button" data-music-source-toggle aria-label="Show SoundCloud player" aria-expanded="false" aria-controls="music-player-source" style="padding: 0; border: 0; background: transparent; color: inherit; font: inherit; text-decoration: underline; cursor: pointer;">SoundCloud</button></p>
      </div>
    </div>
    <input class="music-player-seek" type="range" min="0" max="243" value="0" step="1" aria-label="Seek through song" aria-valuetext="0:00 of 4:03" disabled />
    <p class="music-player-status" role="status"></p>
  </div>
  <div class="music-player-controls">
      <button type="button" data-music-play aria-label="Play Angel on a Satellite">
        <svg class="music-icon-play" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" focusable="false"><path d="M3 3.732a1.5 1.5 0 0 1 2.305-1.265l6.706 4.267a1.5 1.5 0 0 1 0 2.531l-6.706 4.268A1.5 1.5 0 0 1 3 12.267V3.732Z"/></svg>
        <svg class="music-icon-pause" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" focusable="false"><path d="M4.5 2a.5.5 0 0 0-.5.5v11a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-11a.5.5 0 0 0-.5-.5h-1ZM10.5 2a.5.5 0 0 0-.5.5v11a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-11a.5.5 0 0 0-.5-.5h-1Z"/></svg>
        <svg class="music-icon-loading" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" focusable="false"><path d="M2 8a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0ZM6.5 8a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0ZM12.5 6.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z"/></svg>
      </button>
  </div>
  <div id="music-player-source" data-music-source hidden style="position: absolute; bottom: calc(100% + 8px); left: 0; width: 100%;">
    <button type="button" data-music-source-close style="display: block; margin: 0 0 4px auto; padding: 4px 8px; border: 0; border-radius: 6px; background: var(--surface); color: var(--text-primary); font: inherit; font-size: 11px; cursor: pointer;">Close SoundCloud player</button>
  </div>
</section>
