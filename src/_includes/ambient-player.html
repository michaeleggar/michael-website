<section id="ambient-player" class="cd-player" aria-label="CD player" hidden>
  <div class="cd-machine">
    <div class="cd-deck" role="group" aria-label="Playback controls">
      <div class="cd-lcd" data-cd-peek>
        <div class="cd-readout" role="timer" aria-label="Disc 1, 0 minutes 0 seconds">
          <span class="cd-lcd-playing" aria-hidden="true"></span>
          <svg class="cd-digits" data-cd-time viewBox="0 0 38 12" aria-hidden="true"></svg>
        </div>
        <span class="cd-level" aria-hidden="true"></span>
        <input type="range" min="0" max="100" value="45" step="1" aria-label="Volume" aria-valuetext="45%" title="Volume" />
      </div>
      <button class="cd-key" type="button" data-cd-restart aria-label="Restart" title="Restart"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M1.5 2h2v8h-2zM10.5 2v8L4.5 6z" /></svg></button>
      <button class="cd-key" type="button" data-cd-stop aria-label="Stop" title="Stop"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 2.5h7v7h-7z" /></svg></button>
      <button class="cd-key cd-key-play" type="button" data-cd-play aria-label="Play" title="Play / pause"><svg viewBox="0 0 12 12" aria-hidden="true"><path class="cd-icon-play" d="M3 1.5v9L10.5 6z" /><path class="cd-icon-pause" d="M2.5 2h2.5v8H2.5zM7 2h2.5v8H7z" /></svg></button>
    </div>
    <div class="cd-well" data-cd-peek aria-hidden="true">
      <span class="cd-spindle"></span>
      <div class="cd-seat"><div class="cd-record">{% include "cd-artwork.svg" %}</div></div>
    </div>
    <div class="cd-lid" aria-hidden="true"><span class="cd-screw cd-screw-left"></span><span class="cd-screw cd-screw-right"></span></div>
  </div>
  <p class="cd-status visually-hidden" role="status"></p>
</section>
