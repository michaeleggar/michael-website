<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
{% set metaTitle = title or site.name %}
{% set metaDescription = description or site.defaultDescription %}
{% set metaImage = socialImage or site.defaultSocialImage %}
{% set metaImageAlt = socialImageAlt or site.defaultSocialImageAlt %}
<title>{{ metaTitle }}</title>
<meta name="description" content="{{ metaDescription }}" />
<link rel="canonical" href="{{ site.url }}{{ page.url }}" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="{{ site.name }}" />
<meta property="og:title" content="{{ metaTitle }}" />
<meta property="og:description" content="{{ metaDescription }}" />
<meta property="og:url" content="{{ site.url }}{{ page.url }}" />
<meta property="og:image" content="{{ site.url }}{% socialImageUrl metaImage %}" />
<meta property="og:image:alt" content="{{ metaImageAlt }}" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{ metaTitle }}" />
<meta name="twitter:description" content="{{ metaDescription }}" />
<meta name="twitter:image" content="{{ site.url }}{% socialImageUrl metaImage %}" />
<meta name="twitter:image:alt" content="{{ metaImageAlt }}" />
<link
  rel="icon"
  type="image/png"
  href="/assets/favicon/favicon-96x96.png"
  sizes="96x96"
/>
<link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />
<link rel="shortcut icon" href="/assets/favicon/favicon.ico" />
<link
  rel="apple-touch-icon"
  sizes="180x180"
  href="/assets/favicon/apple-touch-icon.png"
/>
<link rel="manifest" href="/assets/favicon/site.webmanifest" />
<script>
  document.documentElement.dataset.theme = "system";
  try {
    const theme = localStorage.getItem("michael-theme");
    if (theme === "light" || theme === "dark") {
      document.documentElement.dataset.theme = theme;
    }
  } catch (error) {}
</script>
<link rel="stylesheet" href="/assets/css/styles.css" />
